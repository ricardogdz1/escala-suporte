<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #F5F3EC;
    --cartao: #FFFFFF;
    --borda: #E5E1D6;
    --texto: #1F2B23;
    --texto-suave: #6B736E;
    --menu: #1F2B23;
    --menu-texto: #D7DED8;
    --menu-ativo: #2F6B3A;
    --verde: #2F6B3A;
    --verde-escuro: #26582F;
    --verde-claro: #E4EFE6;
    --amarelo: #E9B44C;
    --ambar: #8A4B08;
    --ambar-claro: #FBEFD9;
    --ambar-borda: #F0D9B0;
    --azul: #2C4A6B;
    --azul-claro: #E3ECF5;
    --vermelho: #9B2C2C;
    --cinza: #8B8F8A;
    --cinza-claro: #F0EEE6;
    --cinza-medio: #ECEAE3;
    --raio: 12px;
    --sombra: 0 1px 2px rgba(31, 43, 35, 0.06);
    --fonte-titulo: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
    --fonte-texto: "IBM Plex Sans", system-ui, sans-serif;
    --menu-largura: 240px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--fonte-texto);
    font-size: 15px;
    line-height: 1.45;
    color: var(--texto);
    background: var(--fundo);
  }
  h1, h2, h3 { font-family: var(--fonte-titulo); margin: 0; line-height: 1.15; letter-spacing: -0.01em; }
  h1 { font-size: 34px; font-weight: 700; }
  h2 { font-size: 20px; font-weight: 700; }
  h3 { font-size: 16px; font-weight: 700; }
  p { margin: 0 0 8px; }
  a { color: var(--verde); }
  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid #7FB58A; outline-offset: 2px; }
  .oculto { display: none !important; }
  .visualmente-oculto {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .sobrelinha {
    font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--texto-suave); margin-bottom: 6px;
  }
  .rotulo-secao {
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--texto-suave); margin-bottom: 12px;
  }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; }

  .menu {
    width: var(--menu-largura);
    flex: 0 0 var(--menu-largura);
    background: var(--menu);
    color: var(--menu-texto);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .menu-topo { display: flex; align-items: center; gap: 12px; padding: 24px 20px 20px; }
  .menu-topo svg { width: 30px; height: 30px; flex: 0 0 auto; }
  .menu-topo .marca { font-family: var(--fonte-titulo); font-size: 19px; font-weight: 700; color: #fff; line-height: 1.1; }
  .menu-topo .sub { font-size: 12.5px; color: #9FAAA2; margin-top: 2px; }
  .menu nav { flex: 1; padding: 4px 14px; display: flex; flex-direction: column; gap: 4px; }
  .menu-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; min-height: 46px; padding: 10px 14px;
    background: none; border: 0; border-radius: 10px;
    color: var(--menu-texto); text-align: left; font-weight: 500; font-size: 15.5px;
  }
  .menu-item:hover { background: rgba(255, 255, 255, 0.07); color: #fff; }
  .menu-item[aria-current="page"] { background: var(--menu-ativo); color: #fff; font-weight: 600; }
  .menu-item .contador {
    min-width: 26px; padding: 2px 8px; border-radius: 13px;
    background: var(--amarelo); color: var(--texto);
    font-size: 13px; font-weight: 700; text-align: center;
  }
  .menu-rodape {
    padding: 16px 20px 20px; border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 13.5px; line-height: 1.35;
  }
  .menu-rodape .pessoa { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto;
    background: #B9D6BF; color: var(--verde-escuro);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; letter-spacing: 0.02em;
  }
  .menu-rodape .nome { color: #fff; font-weight: 600; }
  .menu-rodape .detalhe { color: #9FAAA2; }
  .botao-rodape {
    margin-top: 12px; min-height: 40px; width: 100%; padding: 6px 10px;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px; color: var(--menu-texto); font-size: 13.5px; font-weight: 500;
  }
  .botao-rodape:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }

  .faixa-teste {
    background: var(--ambar-claro); color: var(--ambar);
    padding: 8px 28px; font-size: 13px; font-weight: 500;
    border-bottom: 1px solid var(--ambar-borda);
  }

  .principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .conteudo { padding: 28px 30px 48px; max-width: 1240px; width: 100%; }
  .cabecalho-tela {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; margin-bottom: 22px;
  }
  .cabecalho-tela .descricao { color: var(--texto-suave); margin: 6px 0 0; font-size: 15px; }
  .cabecalho-tela .acoes-tela { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* ---------- Cabeçalho móvel ---------- */
  .barra-movel {
    display: none; align-items: center; gap: 10px;
    background: var(--menu); color: #fff; padding: 10px 14px;
    position: sticky; top: 0; z-index: 20;
  }
  .barra-movel .marca { font-family: var(--fonte-titulo); font-weight: 700; font-size: 18px; }
  .botao-menu {
    width: 44px; height: 44px; border: 0; border-radius: 8px;
    background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 22px;
  }

  @media (max-width: 860px) {
    .app { flex-direction: column; }
    .barra-movel { display: flex; }
    .menu {
      position: fixed; top: 0; left: 0; z-index: 30;
      transform: translateX(-100%); transition: transform 0.2s ease;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
    }
    .menu.aberto { transform: translateX(0); }
    .cortina { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 25; }
    .conteudo { padding: 18px 16px 40px; }
    h1 { font-size: 28px; }
  }

  /* ---------- Componentes ---------- */
  .cartao {
    background: var(--cartao); border: 1px solid var(--borda);
    border-radius: var(--raio); padding: 18px 20px; box-shadow: var(--sombra);
  }
  .cartao + .cartao { margin-top: 14px; }
  .cartao > h2, .cartao > h3 { margin-bottom: 12px; }
  .cartao.problema { border-color: #E9C48A; }
  .cartao.bloqueado { background: var(--cinza-medio); border-color: var(--cinza-medio); }
  .grade { display: grid; gap: 14px; }
  .grade-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grade-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grade-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .grade-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grade-3 { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { .grade-4, .grade-2 { grid-template-columns: 1fr; } }
  .com-lateral { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .com-lateral { grid-template-columns: 1fr; } }

  .botao {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 46px; padding: 10px 18px;
    border: 1.5px solid var(--verde); border-radius: 9px;
    background: var(--verde); color: #fff; font-weight: 600; font-size: 15px;
    text-decoration: none;
  }
  .botao:hover { background: var(--verde-escuro); border-color: var(--verde-escuro); }
  .botao.escuro { background: var(--menu); border-color: var(--menu); }
  .botao.escuro:hover { background: #0F1712; border-color: #0F1712; }
  .botao.contorno { background: #fff; color: var(--verde); }
  .botao.contorno:hover { background: var(--verde-claro); }
  .botao.neutro { background: #fff; color: var(--texto); border-color: var(--borda); }
  .botao.neutro:hover { background: var(--cinza-claro); }
  .botao.discreto { background: none; border-color: transparent; color: var(--verde); }
  .botao.discreto:hover { background: var(--verde-claro); }
  .botao.ambar { background: var(--ambar); border-color: var(--ambar); }
  .botao.ambar:hover { background: #703C06; border-color: #703C06; }
  .botao:disabled { opacity: 0.55; cursor: not-allowed; }
  .botao.pequeno { min-height: 38px; padding: 6px 13px; font-size: 14px; }
  .botao.largo { width: 100%; }
  .botao.tracejado {
    background: none; border: 1.5px dashed var(--cinza); color: var(--texto-suave); font-weight: 500;
  }
  .botao.tracejado:hover { border-color: var(--verde); color: var(--verde); background: #fff; }

  .navegacao-periodo { display: inline-flex; gap: 10px; }
  .navegacao-periodo .botao { white-space: nowrap; }

  .etiqueta {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 12px; border-radius: 999px;
    font-size: 14px; font-weight: 500; line-height: 1.3;
    background: var(--verde-claro); color: var(--verde);
  }
  .etiqueta.cinza { background: var(--cinza-claro); color: var(--texto); }
  .etiqueta.suave { background: var(--cinza-claro); color: var(--texto-suave); }
  .etiqueta.ambar { background: var(--ambar-claro); color: var(--ambar); }
  .etiqueta.azul { background: var(--azul-claro); color: var(--azul); }
  .etiqueta.contorno { background: none; border: 1.5px dashed var(--ambar); color: var(--ambar); padding: 3.5px 10.5px; }
  .etiqueta.cheia { background: var(--verde); color: #fff; }
  .etiqueta.grande { font-size: 15px; padding: 7px 14px; }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; }
  .pilula { font-weight: 600; white-space: nowrap; }

  .aviso {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--ambar-claro); color: var(--ambar);
    border: 1px solid var(--ambar-borda); border-radius: 10px; padding: 12px 14px;
    line-height: 1.4;
  }
  .aviso::before { content: "⚠"; font-size: 17px; line-height: 1.2; flex: 0 0 auto; }
  .aviso strong { display: block; font-weight: 700; }
  .aviso .explicacao { font-size: 14px; }
  .lista-avisos { display: flex; flex-direction: column; gap: 10px; }
  .nota { color: var(--texto-suave); font-size: 14px; }
  .vazio { color: var(--texto-suave); font-style: italic; }

  .alternador { display: inline-flex; background: var(--cinza-medio); border-radius: 12px; padding: 4px; gap: 2px; }
  .alternador button {
    min-height: 40px; padding: 6px 20px; border: 0; border-radius: 9px;
    background: none; color: var(--texto-suave); font-weight: 500; font-size: 15px;
  }
  .alternador button[aria-pressed="true"] { background: #fff; color: var(--texto); font-weight: 600; box-shadow: var(--sombra); }

  table.tabela { width: 100%; border-collapse: collapse; font-size: 15px; }
  .tabela th, .tabela td { text-align: left; padding: 14px 10px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  .tabela th {
    font-weight: 500; color: var(--texto-suave); font-size: 12.5px;
    letter-spacing: 0.1em; text-transform: uppercase; padding-top: 4px; padding-bottom: 10px;
  }
  .tabela td.dia { font-weight: 700; white-space: nowrap; }
  .tabela .celula-problema {
    display: inline-block; background: var(--ambar-claro); color: var(--ambar);
    font-weight: 500; padding: 8px 12px; border-radius: 8px; line-height: 1.35;
  }
  .tabela tr.hoje td { background: #FAFAF6; }

  .numero-grande { font-family: var(--fonte-titulo); font-size: 40px; font-weight: 800; line-height: 1; }
  .numero-grande.ambar { color: var(--ambar); }

  .campo { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
  .campo select, .campo input[type="date"], .campo input[type="text"] {
    display: block; width: 100%; min-height: 46px; margin-top: 6px; padding: 8px 12px;
    border: 1.5px solid var(--borda); border-radius: 9px; font: inherit; font-weight: 400; background: #fff;
  }
  .opcao { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--borda); cursor: pointer; }
  .opcao:last-of-type { border-bottom: 0; }
  .opcao input { width: 22px; height: 22px; margin: 2px 0 0; flex: 0 0 auto; accent-color: var(--verde); }
  .opcao .texto strong { display: block; }
  .opcao .texto span { color: var(--texto-suave); font-size: 13.5px; }

  /* ---------- Carregando / mensagens ---------- */
  .carregando { color: var(--texto-suave); padding: 30px 0; text-align: center; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--texto); color: #fff; padding: 12px 18px; border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); z-index: 100; max-width: 90vw;
  }
  .toast.erro { background: var(--vermelho); }

  /* ---------- Modal ---------- */
  .modal-fundo {
    position: fixed; inset: 0; background: rgba(31, 43, 35, 0.5); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    background: #fff; border-radius: 14px; padding: 24px; width: 100%; max-width: 520px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
  }
  .modal h2 { margin-bottom: 12px; }
  .acoes { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
</style>
