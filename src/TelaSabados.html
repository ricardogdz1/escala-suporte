<style>
  .lista-sabados { display: flex; flex-direction: column; gap: 14px; }
  .cartao-sabado { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 8px 18px; align-items: start; padding: 20px 22px; }
  .cartao-sabado.passado { opacity: 0.75; }
  .cartao-sabado .dia-grande { text-align: center; padding-top: 4px; }
  .cartao-sabado .dia-grande .numero { font-family: var(--fonte-titulo); font-size: 40px; font-weight: 800; line-height: 1; }
  .cartao-sabado .dia-grande .mes { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--texto-suave); margin-top: 4px; }
  .cartao-sabado .linhas { display: flex; flex-direction: column; gap: 10px; }
  .cartao-sabado .turno { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cartao-sabado .turno .hora { color: var(--texto-suave); font-size: 14px; width: 62px; flex: 0 0 auto; }
  .cartao-sabado .etiqueta button {
    background: none; border: 0; color: inherit; padding: 0 0 0 2px; font-size: 14px; line-height: 1; cursor: pointer; opacity: 0.7;
  }
  .cartao-sabado .etiqueta button:hover { opacity: 1; }
  .cartao-sabado .lado { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .cartao-sabado.bloqueado { grid-template-columns: 72px minmax(0, 1fr); }
  .cartao-sabado.bloqueado .titulo-bloqueio { font-weight: 700; font-size: 17px; }
  @media (max-width: 700px) {
    .cartao-sabado { grid-template-columns: 56px minmax(0, 1fr); }
    .cartao-sabado .lado { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; }
  }
  .legenda { display: flex; flex-direction: column; gap: 10px; }
  .legenda div { display: flex; align-items: center; gap: 10px; color: var(--texto-suave); font-size: 14px; }
  .painel-confirmar { position: sticky; top: 16px; }
  .painel-confirmar .subtitulo { color: var(--texto-suave); margin: -6px 0 14px; }
</style>
<script>
/**
 * Tela Sábados: um cartão por sábado do mês com turnos, contagem e cobertura por setor.
 * A confirmação da escala acontece no painel lateral (não em janela).
 */
(function () {
  var estado = { mes: '' };

  TELAS.sabados = {
    titulo: 'Sábados',
    carregar: function (corpo, acoes) {
      if (TELAS.sabados.parametros && TELAS.sabados.parametros.mes) estado.mes = TELAS.sabados.parametros.mes;
      return carregar(corpo, acoes);
    }
  };

  function nomeMes(iso) {
    var p = iso.split('-');
    return MESES_NOME[Number(p[1]) - 1];
  }
  function capitalizar(t) { return t.charAt(0).toUpperCase() + t.slice(1); }

  function carregar(corpo, acoes) {
    corpo.innerHTML = '<div class="carregando">Carregando…</div>';
    return api('obterSabados', estado.mes).then(function (d) {
      estado.mes = d.mes;
      atualizarCabecalho({
        titulo: 'Sábados de ' + nomeMes(d.mes),
        descricao: 'De ' + d.minimo + ' a ' + d.maximo + ' pessoas por sábado, somando os dois turnos, com pelo menos 1 pessoa de cada setor.'
      });
      acoes.innerHTML =
        '<div class="navegacao-periodo">' +
          '<button type="button" class="botao neutro" data-ir="' + esc(d.anterior) + '">‹ ' + esc(capitalizar(nomeMes(d.anterior))) + '</button>' +
          '<button type="button" class="botao neutro" data-ir="' + esc(d.proximo) + '">' + esc(capitalizar(nomeMes(d.proximo))) + ' ›</button>' +
        '</div>';
      acoes.querySelectorAll('[data-ir]').forEach(function (b) {
        b.addEventListener('click', function () { estado.mes = b.dataset.ir; carregar(corpo, acoes); });
      });

      corpo.innerHTML = '';
      var grade = el('<div class="com-lateral"></div>');
      var lista = el('<div class="lista-sabados"></div>');
      if (!d.sabados.length) lista.innerHTML = '<div class="cartao"><p class="vazio">Nenhum sábado neste mês.</p></div>';
      var lateral = el('<div></div>');
      var painel = el('<div class="cartao painel-confirmar oculto"></div>');
      lateral.appendChild(painel);
      lateral.appendChild(resumoAno(d));
      lateral.appendChild(legenda());

      var ctx = { d: d, corpo: corpo, acoes: acoes, painel: painel };
      d.sabados.forEach(function (s) { lista.appendChild(cartao(s, ctx)); });
      grade.appendChild(lista);
      grade.appendChild(lateral);
      corpo.appendChild(grade);
    });
  }

  function etiquetaPessoa(p, s, ctx) {
    var podeTirar = p.minha || ctx.d.souGestor;
    var e = el('<span class="etiqueta ' + (p.minha ? 'cheia' : 'cinza') + '">' + esc(p.nome) +
      (podeTirar ? '<button type="button" aria-label="Tirar ' + esc(p.nome) + ' da escala" title="Tirar da escala">✕</button>' : '') + '</span>');
    if (podeTirar) e.querySelector('button').addEventListener('click', function () { cancelar(p, s, ctx); });
    return e;
  }

  function turno(hora, pessoas, s, ctx) {
    var t = el('<div class="turno"><span class="hora">' + esc(hora) + '</span><div class="etiquetas"></div></div>');
    var cont = t.querySelector('.etiquetas');
    if (!pessoas.length) cont.innerHTML = '<span class="vazio">Ninguém ainda</span>';
    pessoas.forEach(function (p) { cont.appendChild(etiquetaPessoa(p, s, ctx)); });
    return t;
  }

  function cartao(s, ctx) {
    var mesCurto = MESES_CURTO[Number(s.data.split('-')[1]) - 1];
    var diaGrande = '<div class="dia-grande"><div class="numero">' + ('0' + s.dia).slice(-2) + '</div><div class="mes">' + mesCurto + '</div></div>';

    if (s.bloqueado) return bloqueadoComEscalados(s, ctx, diaGrande);

    var c = el('<div class="cartao cartao-sabado' + (s.problema ? ' problema' : '') + (s.passado ? ' passado' : '') + '">' + diaGrande + '</div>');
    var linhas = el('<div class="linhas"></div>');
    linhas.appendChild(turno('8h–11h', s.turnos.t8, s, ctx));
    linhas.appendChild(turno('9h–12h', s.turnos.t9, s, ctx));
    if (s.turnos.semTurno.length) linhas.appendChild(turno('Sem turno', s.turnos.semTurno, s, ctx));
    var setores = el('<div class="etiquetas"></div>');
    s.setores.forEach(function (st) {
      setores.appendChild(el('<span class="etiqueta ' + (st.coberto ? '' : 'contorno') + '" title="' + (st.coberto ? 'setor coberto' : 'sem ninguém: gera aviso') + '">' + esc(capitalizar(st.nome.toLowerCase())) + '</span>'));
    });
    linhas.appendChild(setores);
    c.appendChild(linhas);

    var lado = el('<div class="lado"></div>');
    lado.appendChild(el('<span class="etiqueta pilula ' + (s.contagemOk ? '' : 'ambar') + '">' + esc(s.contagemTexto) + '</span>'));
    if (!s.minhaEscala) {
      var b = el('<button type="button" class="botao contorno pequeno">Me escalar</button>');
      b.addEventListener('click', function () { abrirConfirmacao(s, ctx, false); });
      lado.appendChild(b);
    }
    if (ctx.d.souGestor) {
      var g = el('<button type="button" class="botao discreto pequeno">Escalar outra pessoa</button>');
      g.addEventListener('click', function () { abrirConfirmacao(s, ctx, true); });
      lado.appendChild(g);
    }
    c.appendChild(lado);
    return c;
  }

  /** Cartão bloqueado (treinamento/feriado), ainda listando quem se escalou mesmo assim. */
  function bloqueadoComEscalados(s, ctx, diaGrande) {
    var c = el('<div class="cartao cartao-sabado bloqueado' + (s.passado ? ' passado' : '') + '">' + diaGrande + '<div></div></div>');
    var corpo = c.lastElementChild;
    corpo.innerHTML = '<div class="titulo-bloqueio">' + esc(s.bloqueios.join('; ')) + '</div><div class="nota">Escalas neste dia geram aviso.</div>';
    var todos = s.turnos.t8.concat(s.turnos.t9, s.turnos.semTurno);
    if (todos.length) {
      var e = el('<div class="etiquetas" style="margin-top:10px"></div>');
      todos.forEach(function (p) { e.appendChild(etiquetaPessoa(p, s, ctx)); });
      corpo.appendChild(e);
    }
    if (!s.minhaEscala) {
      var b = el('<div style="margin-top:12px"><button type="button" class="botao neutro pequeno">Me escalar</button></div>');
      b.querySelector('button').addEventListener('click', function () { abrirConfirmacao(s, ctx, false); });
      corpo.appendChild(b);
    }
    return c;
  }

  function rotuloData(s) {
    var d = dataDe(s.data);
    return 'Sábado, ' + d.getDate() + ' de ' + MESES_NOME[d.getMonth()];
  }

  /** Painel lateral: escolha do turno (e pessoa, se gestor) → confirmação com avisos. */
  function abrirConfirmacao(s, ctx, outraPessoa) {
    var painel = ctx.painel;
    painel.classList.remove('oculto');
    painel.innerHTML =
      '<h2>Confirmar escala</h2>' +
      '<p class="subtitulo">' + esc(rotuloData(s)) + '</p>' +
      (outraPessoa
        ? '<label class="campo">Pessoa<select id="escPessoa">' +
            ctx.d.pessoas.map(function (p) { return '<option value="' + esc(p.email) + '">' + esc(p.nome) + '</option>'; }).join('') +
          '</select></label>'
        : '') +
      '<div style="margin-top:8px">' +
        '<label class="opcao"><input type="radio" name="turno" value="8-11" checked><span class="texto"><strong>8h às 11h</strong><span>' + s.turnos.t8.length + ' pessoa(s) neste turno</span></span></label>' +
        '<label class="opcao"><input type="radio" name="turno" value="9-12"><span class="texto"><strong>9h às 12h</strong><span>' + s.turnos.t9.length + ' pessoa(s) neste turno</span></span></label>' +
      '</div>' +
      '<div class="acoes"><button type="button" class="botao neutro" data-acao="cancelar">Cancelar</button>' +
      '<button type="button" class="botao escuro" data-acao="salvar">Confirmar</button></div>';
    painel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    painel.querySelector('[data-acao="cancelar"]').addEventListener('click', function () { painel.classList.add('oculto'); painel.innerHTML = ''; });
    painel.querySelector('[data-acao="salvar"]').addEventListener('click', function () {
      var turno = painel.querySelector('input[name="turno"]:checked').value;
      var dados = { data: s.data, turno: turno };
      if (outraPessoa) dados.email = painel.querySelector('#escPessoa').value;
      painel.querySelector('[data-acao="salvar"]').disabled = true;
      chamarComConfirmacao('escalarSabado', dados, {
        painel: painel, textoBotao: 'Salvar mesmo assim', titulo: 'Confirmar escala',
        subtitulo: rotuloData(s) + ' · ' + (turno === '8-11' ? '8h às 11h' : '9h às 12h')
      }).then(function (r) {
        painel.classList.add('oculto'); painel.innerHTML = '';
        if (!r) return;
        toast('Escala salva' + (r.avisosIgnorados ? ' (com aviso registrado)' : '') + '.');
        carregar(ctx.corpo, ctx.acoes);
        atualizarContadorAvisos();
      }).catch(function (e) { painel.classList.add('oculto'); painel.innerHTML = ''; mostrarErro(e); });
    });
  }

  function cancelar(p, s, ctx) {
    var painel = ctx.painel;
    var quem = p.minha ? 'Sair da escala?' : 'Tirar ' + p.nome + ' da escala?';
    painel.classList.remove('oculto');
    painel.innerHTML = '<h2>' + esc(quem) + '</h2><p class="subtitulo">' + esc(rotuloData(s)) + '</p>' +
      '<div class="acoes"><button type="button" class="botao neutro" data-acao="nao">Voltar</button>' +
      '<button type="button" class="botao escuro" data-acao="sim">Confirmar</button></div>';
    painel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    painel.querySelector('[data-acao="nao"]').addEventListener('click', function () { painel.classList.add('oculto'); painel.innerHTML = ''; });
    painel.querySelector('[data-acao="sim"]').addEventListener('click', function () {
      chamarComConfirmacao('cancelarSabado', p.id, { painel: painel, textoBotao: 'Tirar mesmo assim', titulo: quem, subtitulo: rotuloData(s) })
        .then(function (r) {
          painel.classList.add('oculto'); painel.innerHTML = '';
          if (!r) return;
          toast('Escala cancelada.');
          carregar(ctx.corpo, ctx.acoes);
          atualizarContadorAvisos();
        }).catch(function (e) { painel.classList.add('oculto'); painel.innerHTML = ''; mostrarErro(e); });
    });
  }

  function resumoAno(d) {
    var m = d.meusNoAno;
    var detalhe = [];
    if (m.ultimo) detalhe.push('Último em ' + m.ultimo);
    detalhe.push(m.agendados ? (m.agendados === 1 ? 'próximo em ' + m.proximo : m.agendados + ' agendados') : 'nenhum agendado');
    return el('<div class="cartao"><h3>Seus sábados em ' + m.ano + '</h3>' +
      '<div class="numero-grande">' + m.total + '</div>' +
      '<p class="nota" style="margin-top:10px">' + esc(detalhe.join(' · ')) + '</p></div>');
  }

  function legenda() {
    return el('<div class="cartao"><h3>Legenda dos setores</h3><div class="legenda">' +
      '<div><span class="etiqueta">Emissão</span> setor coberto</div>' +
      '<div><span class="etiqueta contorno">Contabilidade</span> sem ninguém: gera aviso</div>' +
      '</div></div>');
  }
})();
</script>
