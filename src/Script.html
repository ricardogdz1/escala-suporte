<script>
/**
 * Base do cliente: navegação, chamadas ao servidor, avisos e modais.
 * Cada tela registra-se em TELAS com {titulo, descricao, sobrelinha?, carregar(corpo, acoes)}.
 *   - titulo/descricao/sobrelinha podem ser função (recebem nada) para textos dinâmicos.
 */
(function () {
  var TELAS = window.TELAS = {};
  var telaAtual = null;
  var conteudo = document.getElementById('conteudo');

  // ---------- Chamada ao servidor ----------
  /** Últimas respostas de leitura, por função+argumentos. Qualquer gravação limpa tudo. */
  var respostasGuardadas = {};
  function ehLeitura(funcao) { return /^(obter|contar|listar)/.test(funcao); }

  window.api = function (funcao) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!ehLeitura(funcao)) respostasGuardadas = {};
    return new Promise(function (resolver, rejeitar) {
      var chamada = google.script.run
        .withSuccessHandler(resolver)
        .withFailureHandler(function (erro) { rejeitar(erro); });
      chamada[funcao].apply(chamada, args);
    });
  };

  /**
   * Leitura com resposta guardada: se já existe uma resposta anterior para os mesmos argumentos,
   * chama aoResponder(dados, false) na hora (tela aparece sem esperar) e, quando o servidor
   * responder, aoResponder(dados, true). Retorna a promessa da resposta do servidor.
   */
  window.apiGuardada = function (funcao, args, aoResponder) {
    var chave = funcao + ':' + JSON.stringify(args);
    if (respostasGuardadas[chave]) aoResponder(respostasGuardadas[chave], false);
    return api.apply(null, [funcao].concat(args)).then(function (dados) {
      respostasGuardadas[chave] = dados;
      aoResponder(dados, true);
      return dados;
    });
  };
  window.limparRespostasGuardadas = function () { respostasGuardadas = {}; };

  // ---------- Utilitários ----------
  window.esc = function (texto) {
    return String(texto == null ? '' : texto).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  window.el = function (html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };
  /** Lista de nomes em texto: "Ana, Bia e Caio". */
  window.listaNomes = function (nomes) {
    if (!nomes.length) return '';
    if (nomes.length === 1) return nomes[0];
    return nomes.slice(0, -1).join(', ') + ' e ' + nomes[nomes.length - 1];
  };
  /** HTML de um aviso {titulo, texto} ou string. */
  window.htmlAviso = function (a) {
    if (typeof a === 'string') return '<div class="aviso"><div>' + esc(a) + '</div></div>';
    return '<div class="aviso"><div><strong>' + esc(a.titulo || a.texto) + '</strong>' +
      (a.titulo && a.texto ? '<div class="explicacao">' + esc(a.texto) + '</div>' : '') + '</div></div>';
  };
  window.MESES_CURTO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  window.MESES_NOME = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  window.DIAS_NOME = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
  /** "yyyy-MM-dd" -> Date local. */
  window.dataDe = function (iso) {
    var p = String(iso).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  };
  /** Date local -> "yyyy-MM-dd". */
  window.isoDe = function (d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  };
  /** Hoje como "yyyy-MM-dd" (para as telas pedirem sempre a mesma chave ao servidor). */
  window.hojeIso = function () { return isoDe(new Date()); };

  // ---------- Mensagens ----------
  window.toast = function (mensagem, erro) {
    var t = el('<div class="toast' + (erro ? ' erro' : '') + '" role="status"></div>');
    t.textContent = mensagem;
    document.getElementById('toasts').appendChild(t);
    setTimeout(function () { t.remove(); }, erro ? 7000 : 3500);
  };
  window.mostrarErro = function (erro) {
    var msg = erro && erro.message ? erro.message : String(erro);
    toast(msg.replace(/^Error:\s*/, ''), true);
    console.error(erro);
  };

  // ---------- Modal ----------
  var raizModal = document.getElementById('modal');
  window.abrirModal = function (html) {
    var fundo = el('<div class="modal-fundo"><div class="modal" role="dialog" aria-modal="true"></div></div>');
    fundo.firstElementChild.innerHTML = html;
    raizModal.appendChild(fundo);
    fundo.addEventListener('click', function (e) { if (e.target === fundo) fecharModal(); });
    var foco = fundo.querySelector('button, input, select, textarea');
    if (foco) foco.focus();
    return fundo.firstElementChild;
  };
  window.fecharModal = function () { raizModal.innerHTML = ''; };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharModal(); });

  // ---------- Avisos: "Cancelar / Salvar mesmo assim" ----------
  /**
   * Chama uma função do servidor que segue o padrão (dados, confirmado).
   * Se vierem avisos, mostra a confirmação; resolve com a resposta final ou null se cancelou.
   * opcoes: {textoBotao, painel: elemento onde desenhar a confirmação (senão usa modal), titulo, subtitulo}
   */
  window.chamarComConfirmacao = function (funcao, dados, opcoes) {
    opcoes = opcoes || {};
    return api(funcao, dados, false).then(function (r) {
      if (!r || !r.precisaConfirmar) return r;
      return confirmarAvisos(r.avisos, opcoes).then(function (ok) {
        if (!ok) return null;
        return api(funcao, dados, true);
      });
    });
  };

  window.confirmarAvisos = function (avisos, opcoes) {
    opcoes = opcoes || {};
    var html =
      '<h2>' + esc(opcoes.titulo || 'Atenção') + '</h2>' +
      (opcoes.subtitulo ? '<p class="nota" style="margin-top:-6px">' + esc(opcoes.subtitulo) + '</p>' : '') +
      '<div class="lista-avisos" style="margin-top:12px">' + avisos.map(htmlAviso).join('') + '</div>' +
      '<p class="nota" style="margin-top:12px">Avisos não impedem lançamentos. Se salvar, fica registrado que você viu este aviso.</p>' +
      '<div class="acoes">' +
        '<button type="button" class="botao neutro" data-acao="cancelar">Cancelar</button>' +
        '<button type="button" class="botao escuro" data-acao="salvar">' + esc(opcoes.textoBotao || 'Salvar mesmo assim') + '</button>' +
      '</div>';
    return new Promise(function (resolver) {
      var alvo;
      var fechar;
      if (opcoes.painel) {
        alvo = opcoes.painel;
        alvo.innerHTML = html;
        alvo.classList.remove('oculto');
        alvo.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        fechar = function () { alvo.innerHTML = ''; alvo.classList.add('oculto'); };
      } else {
        alvo = abrirModal(html);
        fechar = fecharModal;
      }
      alvo.querySelector('[data-acao="cancelar"]').addEventListener('click', function () { fechar(); resolver(false); });
      alvo.querySelector('[data-acao="salvar"]').addEventListener('click', function () { fechar(); resolver(true); });
      alvo.querySelector('[data-acao="cancelar"]').focus();
    });
  };

  // ---------- Trocas: janela "Propor troca" ----------
  /**
   * Abre a janela para propor a troca de um lançamento meu por um de colega (mesmo tipo).
   * aoConcluir() é chamado depois que a proposta foi enviada.
   */
  window.abrirPropostaTroca = function (idLancamento, aoConcluir) {
    var m = abrirModal('<h2>Propor troca</h2><div class="carregando">Carregando…</div>');
    api('obterCandidatosTroca', idLancamento).then(function (d) {
      if (!d.candidatos.length) {
        m.innerHTML = '<h2>Propor troca</h2><p class="nota">Trocar o seu <strong>' + esc(d.meu.rotulo) + '</strong> por…</p>' +
          '<p class="vazio" style="margin-top:12px">Nenhum colega tem lançamento desse tipo nos próximos 90 dias.</p>' +
          '<div class="acoes"><button type="button" class="botao neutro" data-acao="fechar">Fechar</button></div>';
        m.querySelector('[data-acao="fechar"]').addEventListener('click', fecharModal);
        return;
      }
      m.innerHTML =
        '<h2>Propor troca</h2>' +
        '<p class="nota">Trocar o seu <strong>' + esc(d.meu.rotulo) + '</strong> por:</p>' +
        '<div class="lista-opcoes" style="margin-top:10px;max-height:50vh;overflow:auto">' +
          d.candidatos.map(function (c, i) {
            return '<label class="opcao"><input type="radio" name="trocaCom" value="' + esc(c.id) + '"' + (i === 0 ? ' checked' : '') + '>' +
              '<span class="texto"><strong>' + esc(c.rotulo) + '</strong><span>' + esc(c.nome) + '</span></span></label>';
          }).join('') +
        '</div>' +
        '<p class="nota" style="margin-top:12px">A pessoa recebe um e-mail e aceita ou recusa no Painel. Ao aceitar, escala e agenda são atualizadas e o gestor é avisado.</p>' +
        '<div class="acoes"><button type="button" class="botao neutro" data-acao="cancelar">Cancelar</button>' +
        '<button type="button" class="botao escuro" data-acao="propor">Propor troca</button></div>';
      m.querySelector('[data-acao="cancelar"]').addEventListener('click', fecharModal);
      m.querySelector('[data-acao="propor"]').addEventListener('click', function () {
        var escolhido = m.querySelector('input[name="trocaCom"]:checked');
        if (!escolhido) return;
        fecharModal();
        chamarComConfirmacao('proporTroca', { meu: d.meu.id, dele: escolhido.value }, {
          textoBotao: 'Enviar mesmo assim', titulo: 'Confirmar proposta',
          subtitulo: 'A troca causaria os avisos abaixo. Quem aceitar também vai vê-los.'
        }).then(function (r) {
          if (!r) return;
          toast('Proposta enviada' + (r.avisosIgnorados ? ' (com aviso registrado)' : '') + '.');
          if (aoConcluir) aoConcluir();
        }).catch(mostrarErro);
      });
    }).catch(function (e) { fecharModal(); mostrarErro(e); });
  };

  // ---------- Navegação ----------
  var menu = document.getElementById('menu');
  var cortina = document.getElementById('cortina');
  var botaoMenu = document.getElementById('botaoMenu');

  function alternarMenu(abrir) {
    menu.classList.toggle('aberto', abrir);
    cortina.classList.toggle('oculto', !abrir);
    botaoMenu.setAttribute('aria-expanded', abrir ? 'true' : 'false');
  }
  botaoMenu.addEventListener('click', function () { alternarMenu(!menu.classList.contains('aberto')); });
  cortina.addEventListener('click', function () { alternarMenu(false); });

  function texto(v) { return typeof v === 'function' ? v() : (v || ''); }

  /** Redesenha o cabeçalho da tela atual (para títulos que mudam com o período). */
  window.atualizarCabecalho = function (dados) {
    var tela = TELAS[telaAtual];
    var cab = document.getElementById('cabecalhoTela');
    if (!tela || !cab) return;
    var sobrelinha = texto(dados && dados.sobrelinha !== undefined ? dados.sobrelinha : tela.sobrelinha);
    var titulo = texto(dados && dados.titulo ? dados.titulo : tela.titulo);
    var descricao = texto(dados && dados.descricao !== undefined ? dados.descricao : tela.descricao);
    cab.innerHTML =
      (sobrelinha ? '<div class="sobrelinha">' + esc(sobrelinha) + '</div>' : '') +
      (titulo ? '<h1>' + esc(titulo) + '</h1>' : '') +
      (descricao ? '<p class="descricao">' + esc(descricao) + '</p>' : '');
  };

  /** Abre uma tela; parametros (opcional) fica em tela.parametros para a tela usar (ex.: {mes: "2026-10"}). */
  window.irPara = function (nome, parametros) {
    var tela = TELAS[nome];
    if (!tela) { nome = 'painel'; tela = TELAS[nome]; }
    tela.parametros = parametros || null;
    telaAtual = nome;
    alternarMenu(false);

    document.querySelectorAll('.menu-item').forEach(function (b) {
      if (b.dataset.tela === nome) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });

    conteudo.innerHTML =
      '<div class="cabecalho-tela"><div id="cabecalhoTela"></div><div class="acoes-tela" id="acoesTela"></div></div>' +
      '<div id="corpoTela"><div class="carregando">Carregando…</div></div>';
    atualizarCabecalho();
    window.scrollTo(0, 0);

    Promise.resolve()
      .then(function () { return tela.carregar(document.getElementById('corpoTela'), document.getElementById('acoesTela')); })
      .catch(function (erro) {
        document.getElementById('corpoTela').innerHTML = '';
        mostrarErro(erro);
      });
  };
  window.recarregarTela = function () { if (telaAtual) irPara(telaAtual); };

  document.querySelectorAll('.menu-item').forEach(function (b) {
    b.addEventListener('click', function () { irPara(b.dataset.tela); });
  });

  // ---------- Avatar ----------
  (function () {
    var partes = String(window.USUARIO.nomeExibicao || window.USUARIO.nome || '?').replace(/\./g, '').trim().split(/\s+/);
    var iniciais = partes.length > 1 ? partes[0][0] + partes[partes.length - 1][0] : partes[0].substring(0, 2);
    document.getElementById('avatar').textContent = iniciais.toUpperCase();
  })();

  // ---------- Configurações (notificações + avisos do painel) ----------
  var GRUPOS_CONFIG = [
    { chave: 'sabados', titulo: 'Sábados', texto: 'Sábado abaixo do mínimo, acima do máximo ou com setor descoberto.' },
    { chave: 'meiodia', titulo: 'Meio-dia', texto: 'Vagas abertas na semana atual.' },
    { chave: 'plantao', titulo: 'Plantão', texto: 'Dias sem ninguém no plantão. Desligado por padrão: plantões são ocasionais.' },
    { chave: 'homeoffice', titulo: 'Home office', texto: 'Mais de uma pessoa na semana ou reserva em semana presencial.' },
    { chave: 'ferias', titulo: 'Férias', texto: 'Sobreposições, prazo limite chegando e (gestor) solicitações aguardando.' }
  ];

  document.getElementById('botaoPreferencias').addEventListener('click', function () {
    alternarMenu(false);
    var m = abrirModal('<h2>Configurações</h2><div class="carregando">Carregando…</div>');
    api('obterMinhasPreferencias').then(function (p) {
      m.innerHTML =
        '<h2>Configurações</h2>' +
        '<h3 class="secao-config">Notificações</h3>' +
        '<label class="opcao"><input type="checkbox" id="prefEmails"' + (p.emails ? ' checked' : '') + '>' +
          '<span class="texto"><strong>Receber e-mails</strong><span>Confirmações, trocas propostas e decisões sobre férias.</span></span></label>' +
        '<label class="opcao"><input type="checkbox" id="prefAgenda"' + (p.agenda ? ' checked' : '') + '>' +
          '<span class="texto"><strong>Eventos na Google Agenda</strong><span>Sábados, plantões, meio-dia, home office e férias entram na sua agenda como compromissos confirmados.</span></span></label>' +
        '<h3 class="secao-config">Avisos no Painel</h3>' +
        '<p class="nota">Escolha quais pendências aparecem para você no Painel.</p>' +
        GRUPOS_CONFIG.map(function (g) {
          return '<label class="opcao"><input type="checkbox" data-grupo="' + g.chave + '"' + (p.avisos[g.chave] ? ' checked' : '') + '>' +
            '<span class="texto"><strong>' + esc(g.titulo) + '</strong><span>' + esc(g.texto) + '</span></span></label>';
        }).join('') +
        (p.souGestor
          ? '<h3 class="secao-config">Equipe (gestor)</h3>' +
            '<p class="nota">Liga ou desliga o aviso de plantão para todas as pessoas de uma vez. Cada uma pode mudar o seu depois.</p>' +
            '<div class="acoes" style="justify-content:flex-start;margin-top:8px">' +
              '<button type="button" class="botao neutro pequeno" data-todos="1">Ativar plantão para todos</button>' +
              '<button type="button" class="botao neutro pequeno" data-todos="0">Desativar para todos</button>' +
            '</div>' +
            '<p class="nota" style="margin-top:14px">Limites das escalas: mínimo do sábado, vagas do meio-dia e do plantão, férias.</p>' +
            '<div class="acoes" style="justify-content:flex-start;margin-top:8px">' +
              '<button type="button" class="botao neutro pequeno" id="abrirRegras">Regras da escala…</button>' +
              '<button type="button" class="botao neutro pequeno" id="abrirPessoas">Pessoas…</button>' +
            '</div>'
          : '') +
        '<div class="acoes"><button type="button" class="botao neutro" id="prefCancelar">Cancelar</button>' +
        '<button type="button" class="botao" id="prefSalvar">Salvar</button></div>';

      m.querySelector('#prefCancelar').addEventListener('click', fecharModal);
      m.querySelector('#prefSalvar').addEventListener('click', function () {
        var botao = m.querySelector('#prefSalvar');
        botao.disabled = true;
        var avisos = {};
        m.querySelectorAll('[data-grupo]').forEach(function (c) { avisos[c.dataset.grupo] = c.checked; });
        api('salvarMinhasPreferencias', {
          emails: m.querySelector('#prefEmails').checked,
          agenda: m.querySelector('#prefAgenda').checked,
          avisos: avisos
        }).then(function () { fecharModal(); toast('Configurações salvas.'); limparRespostasGuardadas(); recarregarTela(); })
          .catch(function (e) { botao.disabled = false; mostrarErro(e); });
      });
      var botaoRegras = m.querySelector('#abrirRegras');
      if (botaoRegras) botaoRegras.addEventListener('click', function () { fecharModal(); janelaRegras(); });
      var botaoPessoas = m.querySelector('#abrirPessoas');
      if (botaoPessoas) botaoPessoas.addEventListener('click', function () { fecharModal(); janelaPessoas(); });

      m.querySelectorAll('[data-todos]').forEach(function (b) {
        b.addEventListener('click', function () {
          var ligar = b.dataset.todos === '1';
          m.querySelectorAll('[data-todos]').forEach(function (x) { x.disabled = true; });
          api('definirAvisoPlantaoParaTodos', ligar).then(function (r) {
            toast('Aviso de plantão ' + (ligar ? 'ativado' : 'desativado') + ' para ' + r.pessoas + ' pessoas.');
            var meu = m.querySelector('[data-grupo="plantao"]');
            if (meu) meu.checked = ligar;
            m.querySelectorAll('[data-todos]').forEach(function (x) { x.disabled = false; });
            limparRespostasGuardadas();
          }).catch(function (e) { m.querySelectorAll('[data-todos]').forEach(function (x) { x.disabled = false; }); mostrarErro(e); });
        });
      });
    }).catch(function (e) { fecharModal(); mostrarErro(e); });
  });

  /**
   * Gestor: limites que o sistema usa nos avisos (aba Config).
   * Mudar aqui muda o aviso de todo mundo, então o servidor valida cada número.
   */
  function janelaRegras() {
    var m = abrirModal('<h2>Regras da escala</h2><div class="carregando">Carregando…</div>');
    api('obterRegras').then(function (regras) {
      m.innerHTML =
        '<h2>Regras da escala</h2>' +
        '<p class="nota">Valem para toda a equipe. Os avisos passam a usar esses números na hora.</p>' +
        regras.map(function (r) {
          return '<label class="campo">' + esc(r.rotulo) +
            '<input type="number" data-chave="' + esc(r.chave) + '" value="' + r.valor + '" min="' + r.min + '" max="' + r.max + '" step="1" inputmode="numeric">' +
            '<span class="nota" style="font-weight:400">' + esc(r.ajuda) + '</span></label>';
        }).join('') +
        '<div class="acoes"><button type="button" class="botao neutro" data-acao="cancelar">Cancelar</button>' +
        '<button type="button" class="botao" data-acao="salvar">Salvar</button></div>';

      m.querySelector('[data-acao="cancelar"]').addEventListener('click', fecharModal);
      m.querySelector('[data-acao="salvar"]').addEventListener('click', function () {
        var botao = m.querySelector('[data-acao="salvar"]');
        botao.disabled = true;
        var valores = {};
        m.querySelectorAll('[data-chave]').forEach(function (c) { valores[c.dataset.chave] = c.value; });
        api('salvarRegras', valores)
          .then(function (r) {
            fecharModal();
            toast(r.alteradas ? 'Regras salvas.' : 'Nada mudou.');
            limparRespostasGuardadas();
            recarregarTela();
          })
          .catch(function (e) { botao.disabled = false; mostrarErro(e); });
      });
    }).catch(function (e) { fecharModal(); mostrarErro(e); });
  }

  /** Gestor: adicionar pessoas e inativar/reativar. Ninguém é apagado: o histórico fica. */
  function janelaPessoas() {
    var m = abrirModal('<h2>Pessoas</h2><div class="carregando">Carregando…</div>');
    // aviso se o servidor não responder: sem isso a janela fica em "Carregando…" sem explicação
    var demorou = setTimeout(function () {
      var c = m.querySelector('.carregando');
      if (c) c.textContent = 'O servidor está demorando… Se não carregar, recarregue a página (F5).';
    }, 12000);
    api('obterPessoas')
      .then(function (d) { clearTimeout(demorou); desenharPessoas(m, d); })
      .catch(function (e) {
        clearTimeout(demorou);
        var msg = (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '');
        m.innerHTML = '<h2>Pessoas</h2>' + htmlAviso({ titulo: 'Não foi possível abrir a lista', texto: msg }) +
          '<div class="acoes"><button type="button" class="botao neutro" data-acao="fechar">Fechar</button></div>';
        m.querySelector('[data-acao="fechar"]').addEventListener('click', fecharModal);
        console.error(e);
      });
  }

  function desenharPessoas(m, d) {
    var ativos = d.pessoas.filter(function (p) { return p.ativo; });
    var inativos = d.pessoas.filter(function (p) { return !p.ativo; });

    var linha = function (p) {
      var detalhe = [p.setor, p.perfil].filter(Boolean).join(' · ');
      if (p.lancamentosFuturos) {
        detalhe += ' · ' + p.lancamentosFuturos + (p.lancamentosFuturos > 1 ? ' lançamentos' : ' lançamento') + ' a partir de hoje';
      }
      return '<div class="linha-pessoa' + (p.ativo ? '' : ' inativa') + '">' +
        '<span class="texto"><strong>' + esc(p.nomeExibicao) + '</strong>' +
        '<span class="nota">' + esc(p.email) + ' · ' + esc(detalhe) + '</span></span>' +
        (p.email === d.meuEmail && p.ativo
          ? '<span class="etiqueta suave">você</span>'
          : '<button type="button" class="botao neutro pequeno" data-email="' + esc(p.email) + '" data-ativar="' + (p.ativo ? '0' : '1') + '">' +
            (p.ativo ? 'Inativar' : 'Reativar') + '</button>') +
        '</div>';
    };

    m.innerHTML =
      '<h2>Pessoas</h2>' +
      '<p class="nota">Quem sai da equipe é <strong>inativado</strong>, nunca apagado: as escalas antigas continuam com o nome.</p>' +
      '<div class="confirmacao-embutida oculto" id="confirmaPessoa"></div>' +
      '<div class="lista-pessoas">' + ativos.map(linha).join('') + '</div>' +
      (inativos.length ? '<h3 class="secao-config">Inativas</h3><div class="lista-pessoas">' + inativos.map(linha).join('') + '</div>' : '') +
      '<h3 class="secao-config">Adicionar pessoa</h3>' +
      '<label class="campo">E-mail corporativo<input type="email" id="novoEmail" placeholder="nome.sobrenome@' + esc(d.dominio) + '" autocomplete="off"></label>' +
      '<label class="campo">Nome de exibição<input type="text" id="novoNome" placeholder="preenchido pelo e-mail" maxlength="60"></label>' +
      '<label class="campo">Setor principal<select id="novoSetor">' +
        d.setores.map(function (st) { return '<option value="' + esc(st) + '">' + esc(st) + '</option>'; }).join('') +
      '</select></label>' +
      '<label class="campo">Perfil<select id="novoPerfil">' +
        d.perfis.map(function (pf) { return '<option value="' + esc(pf) + '">' + esc(pf) + '</option>'; }).join('') +
      '</select></label>' +
      '<label class="campo">Entrou na equipe em<input type="date" id="novaData" value="' + esc(d.hoje) + '"></label>' +
      '<div class="acoes"><button type="button" class="botao neutro" data-acao="fechar">Fechar</button>' +
      '<button type="button" class="botao" data-acao="adicionar">Adicionar</button></div>';

    m.querySelector('[data-acao="fechar"]').addEventListener('click', fecharModal);

    // sugere o nome a partir do e-mail, sem apagar o que o gestor digitou
    var campoEmail = m.querySelector('#novoEmail');
    var campoNome = m.querySelector('#novoNome');
    campoEmail.addEventListener('blur', function () {
      if (campoNome.value.trim()) return;
      var local = campoEmail.value.split('@')[0] || '';
      campoNome.value = local.split(/[._-]+/).filter(Boolean)
        .map(function (x) { return x.charAt(0).toUpperCase() + x.slice(1).toLowerCase(); }).join(' ');
    });

    m.querySelector('[data-acao="adicionar"]').addEventListener('click', function () {
      var botao = m.querySelector('[data-acao="adicionar"]');
      botao.disabled = true;
      api('adicionarPessoa', {
        email: campoEmail.value,
        nome: campoNome.value,
        nomeExibicao: campoNome.value,
        setor: m.querySelector('#novoSetor').value,
        perfil: m.querySelector('#novoPerfil').value,
        dataEntrada: m.querySelector('#novaData').value
      }).then(function (r) {
        toast(r.nome + ' entrou no cadastro.');
        limparRespostasGuardadas();
        return api('obterPessoas').then(function (novo) { desenharPessoas(m, novo); });
      }).catch(function (e) { botao.disabled = false; mostrarErro(e); });
    });

    m.querySelectorAll('[data-email]').forEach(function (b) {
      b.addEventListener('click', function () {
        var ativar = b.dataset.ativar === '1';
        b.disabled = true;
        chamarComConfirmacao('definirPessoaAtiva', { email: b.dataset.email, ativo: ativar },
          { painel: m.querySelector('#confirmaPessoa'),
            titulo: ativar ? 'Reativar' : 'Inativar', textoBotao: ativar ? 'Reativar mesmo assim' : 'Inativar mesmo assim' })
          .then(function (r) {
            if (!r) { b.disabled = false; return; }
            toast(ativar ? 'Pessoa reativada.' : 'Pessoa inativada.');
            limparRespostasGuardadas();
            return api('obterPessoas').then(function (novo) { desenharPessoas(m, novo); });
          })
          .catch(function (e) { b.disabled = false; mostrarErro(e); });
      });
    });
  }

  window.addEventListener('DOMContentLoaded', function () {
    irPara(window.TELA_INICIAL);
  });
})();
</script>
