<script>
/**
 * Base do cliente: navegação, chamadas ao servidor, avisos e modais.
 * Cada tela registra-se em TELAS com {titulo, descricao, carregar(container)}.
 */
(function () {
  var TELAS = window.TELAS = {};
  var telaAtual = null;
  var conteudo = document.getElementById('conteudo');

  // ---------- Chamada ao servidor ----------
  window.api = function (funcao) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolver, rejeitar) {
      var chamada = google.script.run
        .withSuccessHandler(resolver)
        .withFailureHandler(function (erro) { rejeitar(erro); });
      chamada[funcao].apply(chamada, args);
    });
  };

  // ---------- Utilitários de HTML ----------
  window.esc = function (texto) {
    return String(texto == null ? '' : texto).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  window.el = function (html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };

  // ---------- Mensagens ----------
  window.toast = function (mensagem, erro) {
    var t = el('<div class="toast' + (erro ? ' erro' : '') + '" role="status"></div>');
    t.textContent = mensagem;
    document.getElementById('toasts').appendChild(t);
    setTimeout(function () { t.remove(); }, erro ? 7000 : 3500);
  };
  window.mostrarErro = function (erro) {
    var msg = erro && erro.message ? erro.message : String(erro);
    toast(msg.replace(/^Error:\s*/, ''), true);
    console.error(erro);
  };

  // ---------- Modal ----------
  var raizModal = document.getElementById('modal');
  window.abrirModal = function (html) {
    var fundo = el('<div class="modal-fundo"><div class="modal" role="dialog" aria-modal="true"></div></div>');
    fundo.firstElementChild.innerHTML = html;
    raizModal.appendChild(fundo);
    fundo.addEventListener('click', function (e) { if (e.target === fundo) fecharModal(); });
    var foco = fundo.querySelector('button, input, select, textarea');
    if (foco) foco.focus();
    return fundo.firstElementChild;
  };
  window.fecharModal = function () { raizModal.innerHTML = ''; };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharModal(); });

  // ---------- Avisos: "Cancelar / Salvar mesmo assim" ----------
  /**
   * Chama uma função do servidor que segue o padrão (dados, confirmado).
   * Se vierem avisos, mostra a janela; resolve com a resposta final ou null se cancelou.
   */
  window.chamarComConfirmacao = function (funcao, dados, textoBotao) {
    return api(funcao, dados, false).then(function (r) {
      if (!r || !r.precisaConfirmar) return r;
      return confirmarAvisos(r.avisos, textoBotao).then(function (ok) {
        if (!ok) return null;
        return api(funcao, dados, true);
      });
    });
  };

  window.confirmarAvisos = function (avisos, textoBotao) {
    return new Promise(function (resolver) {
      var m = abrirModal(
        '<h2>Atenção</h2>' +
        '<div class="aviso" style="flex-direction:column;gap:6px">' +
          avisos.map(function (a) { return '<div>• ' + esc(a.texto) + '</div>'; }).join('') +
        '</div>' +
        '<p class="vazio" style="margin-top:12px">Avisos não impedem lançamentos. Se salvar, fica registrado que você viu este aviso.</p>' +
        '<div class="acoes">' +
          '<button type="button" class="botao secundario" data-acao="cancelar">Cancelar</button>' +
          '<button type="button" class="botao ambar" data-acao="salvar">' + esc(textoBotao || 'Salvar mesmo assim') + '</button>' +
        '</div>');
      m.querySelector('[data-acao="cancelar"]').addEventListener('click', function () { fecharModal(); resolver(false); });
      m.querySelector('[data-acao="salvar"]').addEventListener('click', function () { fecharModal(); resolver(true); });
      m.querySelector('[data-acao="cancelar"]').focus();
    });
  };

  // ---------- Navegação ----------
  var menu = document.getElementById('menu');
  var cortina = document.getElementById('cortina');
  var botaoMenu = document.getElementById('botaoMenu');

  function alternarMenu(abrir) {
    menu.classList.toggle('aberto', abrir);
    cortina.classList.toggle('oculto', !abrir);
    botaoMenu.setAttribute('aria-expanded', abrir ? 'true' : 'false');
  }
  botaoMenu.addEventListener('click', function () { alternarMenu(!menu.classList.contains('aberto')); });
  cortina.addEventListener('click', function () { alternarMenu(false); });

  window.irPara = function (nome) {
    var tela = TELAS[nome];
    if (!tela) { nome = 'painel'; tela = TELAS[nome]; }
    telaAtual = nome;
    alternarMenu(false);

    document.querySelectorAll('.menu-item').forEach(function (b) {
      if (b.dataset.tela === nome) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });

    conteudo.innerHTML =
      '<div class="cabecalho-tela"><div><h1>' + esc(tela.titulo) + '</h1>' +
      (tela.descricao ? '<p class="descricao">' + esc(tela.descricao) + '</p>' : '') +
      '</div><div id="acoesTela"></div></div>' +
      '<div id="corpoTela"><div class="carregando">Carregando…</div></div>';
    window.scrollTo(0, 0);

    Promise.resolve()
      .then(function () { return tela.carregar(document.getElementById('corpoTela'), document.getElementById('acoesTela')); })
      .catch(function (erro) {
        document.getElementById('corpoTela').innerHTML = '';
        mostrarErro(erro);
      });
  };
  window.recarregarTela = function () { if (telaAtual) irPara(telaAtual); };

  document.querySelectorAll('.menu-item').forEach(function (b) {
    b.addEventListener('click', function () { irPara(b.dataset.tela); });
  });

  // ---------- Telas ainda não construídas ----------
  ['meiodia', 'homeoffice', 'ferias'].forEach(function (nome) {
    var titulos = { meiodia: 'Meio-dia e plantão', homeoffice: 'Home office', ferias: 'Férias' };
    TELAS[nome] = {
      titulo: titulos[nome],
      carregar: function (corpo) {
        corpo.innerHTML = '<div class="cartao"><p class="vazio">Esta tela ainda está em construção.</p></div>';
      }
    };
  });

  // ---------- Preferências de notificação ----------
  document.getElementById('botaoPreferencias').addEventListener('click', function () {
    alternarMenu(false);
    var m = abrirModal(
      '<h2>Notificações</h2>' +
      '<p class="vazio">Escolha o que você quer receber. Seus lançamentos continuam valendo do mesmo jeito.</p>' +
      '<div class="carregando">Carregando…</div>');
    api('obterMinhasPreferencias').then(function (p) {
      m.innerHTML =
        '<h2>Notificações</h2>' +
        '<p class="vazio">Escolha o que você quer receber. Seus lançamentos continuam valendo do mesmo jeito.</p>' +
        '<label class="opcao"><input type="checkbox" id="prefEmails"' + (p.emails ? ' checked' : '') + '>' +
          '<span class="texto"><strong>Receber e-mails</strong><span>Confirmações, trocas propostas e avisos.</span></span></label>' +
        '<label class="opcao"><input type="checkbox" id="prefAgenda"' + (p.agenda ? ' checked' : '') + '>' +
          '<span class="texto"><strong>Convites na Google Agenda</strong><span>Sábados, plantões, meio-dia e home office aparecem na sua agenda.</span></span></label>' +
        '<div class="acoes"><button type="button" class="botao secundario" id="prefCancelar">Cancelar</button>' +
        '<button type="button" class="botao" id="prefSalvar">Salvar</button></div>';
      m.querySelector('#prefCancelar').addEventListener('click', fecharModal);
      m.querySelector('#prefSalvar').addEventListener('click', function () {
        var botao = m.querySelector('#prefSalvar');
        botao.disabled = true;
        api('salvarMinhasPreferencias', {
          emails: m.querySelector('#prefEmails').checked,
          agenda: m.querySelector('#prefAgenda').checked
        }).then(function () { fecharModal(); toast('Preferências salvas.'); })
          .catch(function (e) { botao.disabled = false; mostrarErro(e); });
      });
    }).catch(function (e) { fecharModal(); mostrarErro(e); });
  });

  // ---------- Contador de avisos no menu (próximas 4 semanas) ----------
  window.atualizarContadorAvisos = function () {
    api('contarAvisosAbertos').then(function (n) {
      var c = document.getElementById('contadorAvisos');
      c.textContent = n;
      c.classList.toggle('oculto', !n);
    }).catch(function () { /* contador é só informativo */ });
  };

  window.addEventListener('DOMContentLoaded', function () {
    irPara(window.TELA_INICIAL);
    atualizarContadorAvisos();
  });
})();
</script>
